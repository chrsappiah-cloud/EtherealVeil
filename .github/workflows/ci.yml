name: CI

on:
  push:
    branches: [master, main, "feature/**", "fix/**"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Lint plists
        run: |
          plutil -lint EtherealVeil/Resources/Info.plist
          plutil -lint EtherealVeil/ExportOptions.plist
          plutil -lint EtherealVeil/EtherealVeil.entitlements

      - name: Validate workflow YAML
        run: |
          brew install yamllint
          yamllint .github/workflows/

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint

  build-and-test:
    name: SPM Build & Test
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build --configuration debug

      - name: Run tests
        run: swift test --configuration debug --parallel

  xcode-build:
    name: Xcode Release Build
    needs: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app (Release, no signing)
        run: |
          xcodebuild build \
            -project EtherealVeil.xcodeproj \
            -scheme EtherealVeil \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

  distribution-assets:
    name: Promotional & Investor Assets
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset tooling
        run: pip install -r scripts/requirements.txt

      - name: Generate 5 promotional images
        run: python3 scripts/generate_distribution_assets.py

      - name: Generate 10-page investor brochure (PDF + pages)
        run: python3 scripts/ethereal_veil_investor_report.py

      - name: Verify promotional and brochure outputs
        run: |
          test -f Promotional/Promo_01_Hero.png
          test -f Promotional/Promo_05_Investor_CI.png
          test -f distribution/EtherealVeil_Investor_Brochure.pdf
          test -f distribution/investor-brochure/pages/EtherealVeil_Brochure_Page_01.png
          test -f distribution/investor-brochure/pages/EtherealVeil_Brochure_Page_10.png

      - name: Upload investor bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: investor-promotional-assets
          path: |
            Promotional/Promo_*.png
            distribution/EtherealVeil_Investor_Brochure.pdf
            distribution/investor-brochure/pages/
          retention-days: 30
