name: CD — GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release configuration
        run: swift build --configuration release

      - name: Run tests
        run: swift test --configuration release --parallel

      - name: Create release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --output "dist/EtherealVeil-${VERSION}.zip" HEAD
          git archive --format=tar.gz --output "dist/EtherealVeil-${VERSION}.tar.gz" HEAD
          cp Package.swift dist/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --title "EtherealVeil $GITHUB_REF_NAME"
