# XcodeGen — generates EtherealVeil.xcodeproj for archive / TestFlight.
# Regenerate: xcodegen generate
name: EtherealVeil
options:
  bundleIdPrefix: com.worldclassscholars
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: TM2WG7HH96
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "101"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  EtherealVeil:
    type: application
    platform: iOS
    sources:
      - path: EtherealVeil
        excludes:
          - ExportOptions.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldclassscholars.etherealveil
        INFOPLIST_FILE: EtherealVeil/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: EtherealVeil/EtherealVeil.entitlements

schemes:
  EtherealVeil:
    build:
      targets:
        EtherealVeil: all
    run:
      config: Debug
    archive:
      config: Release
