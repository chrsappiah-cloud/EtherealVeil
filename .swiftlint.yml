included:
  - EtherealVeil
  - Tests

excluded:
  - .build
  - .swiftpm

opt_in_rules:
  - closure_spacing
  - empty_count
  - first_where
  - identical_operands
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - trailing_whitespace
  - force_try              # acceptable in test tear-down
  - explicit_init          # SwiftUI @StateObject init is idiomatic
  - trailing_comma
  - sorted_imports

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 450
  error: 500

file_length:
  warning: 500
  error: 550

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 1
  excluded:
    - id
    - p
    - i
    - t

reporter: "xcode"
